<!DOCTYPE html>
<html>
<head>
    <title>String Method</title>

    <style>
        body {
            text-align: center;
            color:purple;
        }
    </style>
</head>

<body>
</body>

<script>

    document.write("<h2>STRING METHOD</h2>");

    let str = "i am arundhathi m p";

    document.write("java script string method<br><br>");

    document.write("i am arundhathi m p<br>");

    document.write("length of string is:" + str.length + "<br>");

    document.write("index of first occurrence of a in string is:"
        + str.indexOf("a") + "<br>");

    document.write("index of last occurrence of a in string is:"
        + str.lastIndexOf("a") + "<br>");

    document.write("index of am in string:"
        + str.indexOf("am") + "<br>");

    document.write("index 0 to 3 print using slice:"
        + str.slice(0, 4) + "<br>");

    document.write("to get substring of string using substring:"
        + str.substring(2, 8) + "<br>");

    document.write("to get substring of string using substr:"
        + str.substr(2, 1) + "<br>");

    document.write("string to upper case:"
        + str.toUpperCase() + "<br>")

    document.write("replace arundhathi to aswathi in string:"
        + str.replace("arundhathi", "aswathi") + "<br>");

    document.write("use trim:" + str.trim() + "<br>");

    document.write("new string that have charecter 5 on string:"
        + str.charAt(5) + "<br>");

    document.write("print numeric ASSI value of charecter 5 on string:"
        + str.charCodeAt(5) + "<br><br>");


    document.write("<h2>MATH OBJECT</h2>");

    document.write("math object is a build in object,contains basic mathematical functions and constants<br><br>");

    document.write("Value of PI in radian:"
        + Math.PI + "<br>");

    document.write("PI in degree:"
        + (Math.PI * 180 / Math.PI) + "<br>");

    document.write("Value of E:"
        + Math.E + "<br>");

    document.write("sign of -3, print 1 if it is positive print -1 if it is negative or print 0 if it is zero:"
        + Math.sign(-3) + "<br>");

    document.write("squareroot of a number 8 is:"
        + Math.sqrt(8) + "<br>");

    document.write("the 2 nd power of 8 is:"
        + Math.pow(8, 2) + "<br>");

    document.write("round the value 6.7 is:"
        + Math.round(6.7) + "<br>");

    document.write("round the value 4.6 is:"
        + Math.round(4.6) + "<br>");

    document.write("ceil the value 4.4 is:"
        + Math.ceil(4.4) + "<br>");

    document.write("ceil the value 4.6 is:"
        + Math.ceil(4.6) + "<br>");

    document.write("floor value of the value 4.4 is:"
        + Math.floor(4.4) + "<br>");

</script>

</html>
