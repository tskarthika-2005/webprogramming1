<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            width: 40px;
            height: 30px;
        }

        th {
            background-color: #f2f2f2;
        }

        td {
            cursor: pointer;
        }
        
       

        td.sunday,
        td.second-saturday {
            color: red;
        }

        td.second-saturday {
            font-weight: bold;
        }

        td:not(:empty):hover {
            background-color: #e6f2ff;
        }

        #calendar-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <h2>Calendar Generator</h2>

    <label for="year">Enter Year:</label>
    <input
        type="number"
        id="year"
        placeholder="Enter year"
        min="1900"
        max="2100"
    >

    <label for="month">Enter Month:</label>
    <input
        type="number"
        id="month"
        placeholder="1-12"
        min="1"
        max="12"
    >

    <button onclick="generateCalendar()">Generate Calendar</button>

    <div id="calendar-container"></div>

    <script>
        function generateCalendar() {
            const year = Number(document.getElementById('year').value);
            const month = Number(document.getElementById('month').value);

            const calendarContainer =
                document.getElementById('calendar-container');

            if (
                !document.getElementById('year').value ||
                !document.getElementById('month').value
            ) {
                alert('Please enter both year and month.');
                return;
            }

            if (
                !Number.isInteger(year) ||
                year < 1900 ||
                year > 2100 ||
                !Number.isInteger(month) ||
                month < 1 ||
                month > 12
            ) {
                alert('Please enter a valid year (1900-2100) and month (1-12).');
                return;
            }

            const daysInMonth = new Date(year, month, 0).getDate();
            const firstDay = new Date(year, month - 1, 1).getDay();

            const monthName = new Date(year, month - 1, 1)
                .toLocaleString('en', { month: 'long' });

            let calendarHTML = `<h3>${monthName} ${year}</h3>`;
            calendarHTML += '<table>';
            calendarHTML += `
                <tr>
                    <th>Sun</th>
                    <th>Mon</th>
                    <th>Tue</th>
                    <th>Wed</th>
                    <th>Thu</th>
                    <th>Fri</th>
                    <th>Sat</th>
                </tr>
            `;

            let dayCounter = 1;

            for (let i = 0; i < 6; i++) {
                calendarHTML += '<tr>';

                for (let j = 0; j < 7; j++) {
                    if (i === 0 && j < firstDay) {
                        calendarHTML += '<td></td>';
                    } else if (dayCounter <= daysInMonth) {
                        const currentDate = new Date(
                            year,
                            month - 1,
                            dayCounter
                        );

                        const isSunday = currentDate.getDay() === 0;

                        const isSecondSaturday =
                            currentDate.getDay() === 6 &&
                            Math.ceil(dayCounter / 7) === 2;

                        let className = '';

                        if (isSunday) {
                            className = 'sunday';
                        } else if (isSecondSaturday) {
                            className = 'second-saturday';
                        }

                        const dateText = currentDate.toDateString();

                        calendarHTML += `
                            <td
                                class="${className}"
                                data-date="${dateText}"
                            >${dayCounter}</td>
                        `;

                        dayCounter++;
                    } else {
                        calendarHTML += '<td></td>';
                    }
                }

                calendarHTML += '</tr>';

                if (dayCounter > daysInMonth) {
                    break;
                }
            }

            calendarHTML += '</table>';

            calendarContainer.innerHTML = calendarHTML;
            calendarContainer.querySelectorAll('td[data-date]')
                .forEach(function (cell) {
                    cell.addEventListener('click', function () {
                        alert('You clicked on ' + cell.dataset.date);
                    });
                });
        }
    </script>

</body>
