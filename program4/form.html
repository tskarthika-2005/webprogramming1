<html>
<head>
<title>registeration form</title>
<style>
body{
background-color:lightblue;
width:900px;
margin:auto;
}
td{
padding:10px;
}
</style>
</head>
<body>
<h2 align=center'>Registeration form</h2>
<form>
<table>
<tr>
<td>Full Name</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Mobile Number</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Email id</td>
<td><input type="Email"></td>
</tr>
<tr>
<td>Age</td>
<td><input type="text"></td>
</tr>
<tr>
<td>gender</td>
<td>
<input type="radio"name="gender">Male
<input type="radio"name="gender">Female
<input type="radio"name="gender">Others
</td>
</tr>
<tr>
<td>Date Of Birth</td>
<td><input type="Date"></td>
</tr>
<tr>
<td>Address</td>
<td>
<textarea rows="8"cols="25"></textarea>
</td>
</tr>
<tr>
<td>Current Study</td>
<td>
<select>
<option>B.tech</option>
<option>BCA</option>
<option>M.rech</option>
<option>MCA</option>
</select>
</td>
</tr>
<tr>
<td>Department</td>
<td>
<select>
<option>CS</option>
<option>IT</OPTION>
<option>EEE</OPTION>
<option>EC</OPTION>
</select>
</td>
</tr>
<tr>
<td>UploadCV</td>
<td><input type="file">
</td>
</tr>
<tr>
<td>programming Languages</td>
<td><input type="checkbox">HTML
<td><input type="checkbox">Reactjs
<td><input type="checkbox">CSS
<td><input type="checkbox">Flutter


</tr>
<tr>
<td>Language</td>
<td><input type="checkbox">English
<td><input type="checkbox">Malayalam
<td><input type="checkbox">Arabic
<td><input type="checkbox">Hindi
</td>
</tr>
<tr>
<td><input type="submit"value="submit">
</td>
<td><input type="reset"value="reset">
</td>
</tr>
</table>
</form>
</body>
</html>
